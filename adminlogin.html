<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schitab Admin — Login</title>
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">Schitab</div>
    <div class="login-tagline">Books for becoming — Admin</div>

    <div id="deniedMsg" class="hint" style="display:none; color:#DC2626; margin-bottom:14px; text-align:center;">
      That account isn't set up as an admin.
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log in</button>
    </form>

    <div style="text-align:center; margin-top:18px;">
      <a href="/index.html" class="hint">← Back to Schitab</a>
    </div>
  </div>
</div>

<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/ui.js"></script>
<script>
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = '/admin/dashboard.html';
  })();

  if (new URLSearchParams(window.location.search).get('denied')) {
    document.getElementById('deniedMsg').style.display = 'block';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Logging in...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showToast(error.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Log in';
      return;
    }

    window.location.href = '/admin/dashboard.html';
  });
</script>

</body>
</html>
