<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schitab — Books for becoming</title>
<meta name="description" content="Schitab — books for every class, exam and student across India. NCERT, JKBOSE, competitive exams, used books and more.">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/storefront.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="site-header">
  <div class="site-header-row">
    <div class="site-logo">📚 Schitab</div>
    <input class="site-search" type="text" placeholder="Search books, authors, exams..." disabled>
    <button class="cart-btn" onclick="window.location.href='/browse.html'">🛒<span class="cart-badge" id="cartBadge" style="display:none;">0</span></button>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Books for <span class="accent-text">becoming.</span></h1>
    <p class="hero-tagline">NCERT, JKBOSE, competitive exams, used books — sourced for students across India.</p>
    <a href="/browse.html" class="btn btn-primary">Browse Books</a>
  </div>
</section>

<h2 class="section-title">Explore Categories</h2>
<div class="category-grid" id="categoryGrid">
  <div class="text-muted" style="grid-column:1/-1; padding:20px; text-align:center;">Loading categories...</div>
</div>

<h2 class="section-title">Latest Books</h2>
<div class="book-grid" id="trendingGrid">
  <div class="text-muted" style="grid-column:1/-1; padding:20px; text-align:center;">Loading books...</div>
</div>

<footer class="site-footer">
  Schitab — Books for becoming.<br>
  <a href="/admin/login.html" class="hint">Admin</a>
</footer>

<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/cart.js"></script>
<script>
  const categoryIcons = ['📘','📗','📙','📕','📔','📒','📓','📚','🎓','✏️'];

  async function loadHomeCategories() {
    const { data, error } = await supabaseClient
      .from('categories')
      .select('*')
      .is('parent_id', null)
      .eq('is_active', true)
      .order('display_order', { ascending: true })
      .limit(10);

    const el = document.getElementById('categoryGrid');

    if (error || !data || data.length === 0) {
      el.innerHTML = '<div class="text-muted" style="grid-column:1/-1; padding:20px; text-align:center;">Categories coming soon.</div>';
      return;
    }

    el.innerHTML = data.map((cat, i) => `
      <a class="category-card" href="/browse.html?cat=${encodeURIComponent(cat.slug)}">
        <span class="cat-icon">${categoryIcons[i % categoryIcons.length]}</span>
        ${escapeHtml(cat.name)}
      </a>
    `).join('');
  }

  async function loadTrendingBooks() {
    const { data, error } = await supabaseClient
      .from('books')
      .select('*')
      .eq('is_active', true)
      .order('created_at', { ascending: false })
      .limit(8);

    const el = document.getElementById('trendingGrid');

    if (error || !data || data.length === 0) {
      el.innerHTML = '<div class="text-muted" style="grid-column:1/-1; padding:20px; text-align:center;">Books coming soon — check back shortly.</div>';
      return;
    }

    el.innerHTML = data.map(renderBookCard).join('');
  }

  function renderBookCard(book) {
    const discount = book.mrp > book.price ? Math.round((1 - book.price / book.mrp) * 100) : 0;
    return `
      <a class="book-card" href="/book.html?id=${book.id}">
        <img class="book-card-img" src="${book.cover_url || 'https://placehold.co/300x400/EEF0F4/999?text=No+Cover'}" alt="${escapeHtml(book.title)}">
        <div class="book-card-body">
          <div class="book-card-title">${escapeHtml(book.title)}</div>
          <div class="book-card-author">${escapeHtml(book.author || book.publisher || '')}</div>
          <div>
            <span class="book-card-price">${formatPrice(book.price)}</span>
            ${discount > 0 ? `<span class="book-card-mrp">${formatPrice(book.mrp)}</span>` : ''}
          </div>
        </div>
      </a>
    `;
  }

  loadHomeCategories();
  loadTrendingBooks();
  updateCartBadge();
</script>

</body>
</html>
