<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schitab Admin</title>
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app-shell">

  <div class="topbar">
    <div class="brand">📚 Schitab Admin</div>
    <button class="btn btn-outline btn-sm" onclick="logoutAdmin()">Log out</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="books">Books</button>
    <button class="tab" data-tab="categories">Categories</button>
    <button class="tab" data-tab="used-books">Used Books</button>
    <button class="tab" data-tab="orders">Orders</button>
  </div>

  <div class="container">

    <!-- ============ BOOKS TAB ============ -->
    <div class="tab-panel active" id="panel-books">
      <div class="card">
        <div class="section-head">
          <h2>Books</h2>
          <button class="btn btn-primary btn-sm" onclick="openBookForm()">+ Add Book</button>
        </div>
        <div id="booksList"><div class="empty-state">Loading books...</div></div>
      </div>
    </div>

    <!-- ============ CATEGORIES TAB ============ -->
    <div class="tab-panel" id="panel-categories">
      <div class="card">
        <div class="section-head">
          <h2>Categories</h2>
          <button class="btn btn-primary btn-sm" onclick="openCategoryForm()">+ Add Category</button>
        </div>
        <div id="categoriesList"><div class="empty-state">Loading categories...</div></div>
      </div>
    </div>

    <!-- ============ USED BOOKS TAB ============ -->
    <div class="tab-panel" id="panel-used-books">
      <div class="card">
        <div class="section-head">
          <h2>Used Book Submissions</h2>
        </div>
        <div id="usedBooksList"><div class="empty-state">Loading submissions...</div></div>
      </div>
    </div>

  </div>
</div>
<!-- ============ ORDERS TAB ============ -->
    <div class="tab-panel" id="panel-orders">
      <div class="card">
        <div class="section-head">
          <h2>Orders</h2>
        </div>
        <div id="ordersList"><div class="empty-state">Loading orders...</div></div>
      </div>
    </div>
<!-- ============ BOOK MODAL ============ -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="bookModalTitle">Add Book</h3>
      <button class="modal-close" onclick="closeModal('bookModal')">&times;</button>
    </div>
    <form id="bookForm">
      <input type="hidden" id="bookId">

      <div class="field">
        <label for="bookTitle">Title *</label>
        <input type="text" id="bookTitle" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="bookAuthor">Author</label>
          <input type="text" id="bookAuthor">
        </div>
        <div class="field">
          <label for="bookPublisher">Publisher</label>
          <input type="text" id="bookPublisher">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="bookIsbn">ISBN</label>
          <input type="text" id="bookIsbn">
        </div>
        <div class="field">
          <label for="bookEdition">Edition</label>
          <input type="text" id="bookEdition">
        </div>
      </div>

      <div class="field">
        <label for="bookCategory">Category *</label>
        <select id="bookCategory" required></select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="bookMrp">MRP (₹) *</label>
          <input type="number" id="bookMrp" step="0.01" required>
        </div>
        <div class="field">
          <label for="bookPrice">Selling Price (₹) *</label>
          <input type="number" id="bookPrice" step="0.01" required>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="bookStock">Stock Quantity</label>
          <input type="number" id="bookStock" value="0">
        </div>
        <div class="field">
          <label for="bookAvailability">Availability</label>
          <select id="bookAvailability">
            <option value="in_stock">In Stock</option>
            <option value="available_to_order" selected>Available to Order</option>
            <option value="ships_3_5_days">Ships in 3-5 Days</option>
            <option value="unavailable">Currently Unavailable</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="bookCoverUrl">Cover Image URL</label>
        <input type="text" id="bookCoverUrl" placeholder="Paste image link, or upload below">
        <input type="file" id="bookCoverFile" accept="image/*" class="mt-16">
        <div class="hint">Upload a photo, or paste a direct image link above.</div>
      </div>

      <div class="field">
        <label for="bookDescription">Description</label>
        <textarea id="bookDescription" rows="3"></textarea>
      </div>

      <div class="field">
        <label class="flex"><input type="checkbox" id="bookActive" checked style="width:auto;"> Active (visible on storefront)</label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="bookSaveBtn">Save Book</button>
    </form>
  </div>
</div>

<!-- ============ CATEGORY MODAL ============ -->
<div class="modal-overlay" id="categoryModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Add Category</h3>
      <button class="modal-close" onclick="closeModal('categoryModal')">&times;</button>
    </div>
    <form id="categoryForm">
      <div class="field">
        <label for="categoryName">Name *</label>
        <input type="text" id="categoryName" required>
      </div>
      <div class="field">
        <label for="categoryParent">Parent Category (optional)</label>
        <select id="categoryParent">
          <option value="">— Top-level category —</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save Category</button>
    </form>
  </div>
</div>

<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/auth-guard.js"></script>
<script src="/assets/js/categories.js"></script>
<script src="/assets/js/books.js"></script>
<script src="/assets/js/used-books.js"></script>
  <script src="/assets/js/orders.js"></script>
<script>
  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  // Init: guard, then load everything
  (async () => {
    const auth = await 
      await loadOrders();requireAdmin();
    if (!auth) return;
    await loadCategories();
    await loadBooks();
    await loadUsedBooks();
  })();
</script>

</body>
</html>
